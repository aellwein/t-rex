[package]
name = "webapp"
version = "0.1.0"
authors = ["Alex Ellwein <alex.ellwein@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dioxus = { version = "0.7.10", features = ["web", "router"] }
dioxus-i18n = "0.6.0"
dioxus-sdk-storage = "0.7.0"
dto = { path = "../dto" }
gloo-net = { version = "0.7.0", features = ["http", "json"] }
serde = "1.0.229"
tracing = "0.1.44"
unic-langid = { version = "0.9.6", features = ["macros"] }
web-sys = { version = "0.3.107", features = [
    "Window",
    "MediaQueryList",
    "Document",
    "Element",
    "DomTokenList",
    "Navigator",
    "Location",
] }
