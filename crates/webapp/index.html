<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Shown until the WebAssembly app has rendered. Plain CSS: it must work before app.css loads. */
        #boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: #f5f5f5;
            color: #525252;
            font-family: system-ui, sans-serif;
            z-index: 10;
        }

        #boot .spinner {
            width: 2.5rem;
            height: 2.5rem;
            border: 3px solid rgba(13, 148, 136, 0.25);
            border-top-color: #0d9488;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
        }

        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-color-scheme: dark) {
            #boot {
                background: #404040;
                color: #d4d4d4;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #boot .spinner {
                animation-duration: 3s;
            }
        }
    </style>
</head>

<body class="bg-neutral-100 dark:bg-neutral-700 text-black dark:text-neutral-300">
    <div id="boot" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span>Loading…</span>
    </div>
    <div id="main"></div>
    <script>
        // Remove the spinner as soon as the app renders into #main.
        (function () {
            var boot = document.getElementById('boot');
            var main = document.getElementById('main');
            function hideBoot() {
                if (boot) boot.remove();
                boot = null;
            }
            if (main.childNodes.length > 0) {
                hideBoot();
                return;
            }
            var observer = new MutationObserver(function () {
                if (main.childNodes.length > 0) {
                    observer.disconnect();
                    hideBoot();
                }
            });
            observer.observe(main, { childList: true });
        })();
    </script>
</body>

</html>
