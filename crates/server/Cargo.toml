[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
dto = { path = "../dto" }
rust-embed = "8.14.0"
mime_guess = { version = "2.0.5" }
tokio = { version = "1.54.1", features = ["full"] }
anyhow = "1.0.104"
pretty_env_logger = "0.5.0"
log = "0.4.35"
dotenvy = "0.15.7"
axum-oidc-client = "0.7.0"
axum = { version = "0.8.9", default-features = false, features = [
    "query",
    "json",
    "tokio",
    "http2",
    "original-uri",
] }
chrono = { version = "0.4.45" }
reqwest = "0.13.5"
icalendar = "0.17"
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "sqlx-sqlite"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
url = "2"
sha2 = "0.11"
base64 = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.3"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1.0.154"

[build-dependencies]
vergen-gitcl = { version = "10.0.3" }

[features]
default = ["embed"]
embed = []   # shall be enabled in release build
