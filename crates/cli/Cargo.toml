[package]
name = "t-rex-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "t-rex"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dirs = "7.0.0"
dto = { version = "0.1.0", path = "../dto" }
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
