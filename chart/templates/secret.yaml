{{- if not .Values.oidc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t-rex.oidcSecretName" . }}
  labels:
    {{- include "t-rex.labels" . | nindent 4 }}
type: Opaque
stringData:
  ISSUER: {{ required "oidc.issuer is required unless oidc.existingSecret is set" .Values.oidc.issuer | quote }}
  CLIENT_ID: {{ required "oidc.clientId is required unless oidc.existingSecret is set" .Values.oidc.clientId | quote }}
  CLIENT_SECRET: {{ required "oidc.clientSecret is required unless oidc.existingSecret is set" .Values.oidc.clientSecret | quote }}
  COOKIE_SECRET: {{ required "oidc.cookieSecret is required unless oidc.existingSecret is set" .Values.oidc.cookieSecret | quote }}
  APP_URL: {{ required "oidc.appUrl is required unless oidc.existingSecret is set" .Values.oidc.appUrl | quote }}
{{- end }}
