{{- if not (include "t-rex.usesPostgres" .) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "t-rex.fullname" . }}-data
  labels:
    {{- include "t-rex.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
