{{- if and (include "t-rex.usesPostgres" .) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t-rex.dbSecretName" . }}
  labels:
    {{- include "t-rex.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "database.password is required when database.url is set and database.existingSecret is empty" .Values.database.password | quote }}
{{- end }}
