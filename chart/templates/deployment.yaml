apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "t-rex.fullname" . }}
  labels:
    {{- include "t-rex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "t-rex.selectorLabels" . | nindent 6 }}
  {{- if include "t-rex.usesPostgres" . }}
  # Postgres keeps the data outside the pod: the new pod starts before the old one stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  # SQLite file on a ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "t-rex.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "t-rex.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.image.hash }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.hash }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if include "t-rex.usesPostgres" . }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "t-rex.dbSecretName" . }}
                  key: password
            {{- else }}
            - name: T_REX_DB_PATH
              value: {{ printf "%s/t-rex.db" .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- range $key := list "ISSUER" "CLIENT_ID" "CLIENT_SECRET" "COOKIE_SECRET" "APP_URL" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "t-rex.oidcSecretName" $ }}
                  key: {{ $key }}
            {{- end }}
          {{- if not (include "t-rex.usesPostgres" .) }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if not (include "t-rex.usesPostgres" .) }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "t-rex.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
